const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const miles = (a, b) => {
  const toR = d => d * Math.PI / 180, Rm = 3958.8;
  const dLat = toR(b[0] - a[0]), dLon = toR(b[1] - a[1]);
  const h = Math.sin(dLat / 2) ** 2 + Math.cos(toR(a[0])) * Math.cos(toR(b[0])) * Math.sin(dLon / 2) ** 2;
  return 2 * Rm * Math.asin(Math.sqrt(h));
};
R.forEach(r => {
  r.d = miles(HOME, [r.lat, r.lng]);
  r.p = r.price.length;
  r.yelp = "https://www.yelp.com/search?find_desc=" + encodeURIComponent(r.name) + "&find_loc=" + encodeURIComponent(r.address);
  r.gmaps = "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(r.name + ", " + r.address);
  r.dir = "https://www.google.com/maps/dir/?api=1&destination=" + encodeURIComponent(r.name + ", " + r.address);
});

const dark = matchMedia("(prefers-color-scheme: dark)").matches;
const map = L.map("map", { zoomControl: true }).setView(HOME, 11);
const esri = s => `https://server.arcgisonline.com/ArcGIS/rest/services/${s}/MapServer/tile/{z}/{y}/{x}`;
const attribution = "Tiles &copy; Esri, HERE, Garmin, &copy; OpenStreetMap contributors";
if (dark) {
  L.tileLayer(esri("Canvas/World_Dark_Gray_Base"), { maxZoom: 16, attribution }).addTo(map);
  L.tileLayer(esri("Canvas/World_Dark_Gray_Reference"), { maxZoom: 16 }).addTo(map);
} else {
  L.tileLayer(esri("World_Street_Map"), { maxZoom: 19, attribution }).addTo(map);
}

// distance rings from home
[5, 10, 20].forEach(mi => {
  L.circle(HOME, { radius: mi * 1609.34, color: getComputedStyle(document.documentElement).getPropertyValue("--home"), weight: 1, opacity: .45, fill: false, dashArray: "4 6", interactive: false }).addTo(map);
  const lbl = L.latLng(HOME[0] + mi / 69.0, HOME[1]);
  L.marker(lbl, { interactive: false, icon: L.divIcon({ className: "ring-label", html: mi + " mi", iconSize: [40, 14], iconAnchor: [20, 7] }) }).addTo(map);
});

L.marker(HOME, {
  zIndexOffset: 2000,
  icon: L.divIcon({ className: "", html: '<div class="homepin"><svg viewBox="0 0 24 24"><path d="M12 3 2 12h3v8h5v-6h4v6h5v-8h3z"/></svg></div>', iconSize: [34, 34], iconAnchor: [17, 17] })
}).addTo(map).bindPopup(`<div class="pop"><div class="eyebrow">Home</div><h3>Mar Vista</h3>Approximate location</div>`);

const legend = L.control({ position: "bottomright" });
legend.onAdd = () => {
  const d = L.DomUtil.create("div", "legend");
  d.innerHTML = [["p1", "$"], ["p2", "$$"], ["p3", "$$$"], ["p4", "$$$$"]].map(([c, l]) => `<div><span style="background:var(--${c})"></span>${l}</div>`).join("");
  return d;
};
legend.addTo(map);

const popupHtml = r => `<div class="pop">
  <div class="eyebrow">#${r.rank} · ${esc(r.hood)} · ${esc(r.price)}</div>
  <h3>${esc(r.name)}</h3>
  <div>${esc(r.cuisine)}</div>
  <div class="addr">${esc(r.address)}</div>
  <div><strong>${r.d.toFixed(1)} mi</strong> from home (straight line)</div>
  ${r.note ? `<div class="note">${esc(r.note)}</div>` : ""}
  <div class="links">
    <a class="yelp" href="${r.yelp}" target="_blank" rel="noopener">Yelp</a>
    <a href="${r.dir}" target="_blank" rel="noopener">Directions</a>
    <a href="${r.gmaps}" target="_blank" rel="noopener">Google Maps</a>
    ${r.website ? `<a href="${esc(r.website)}" target="_blank" rel="noopener">Website</a>` : ""}
  </div></div>`;

R.forEach(r => {
  r.m = L.marker([r.lat, r.lng], {
    title: r.name, riseOnHover: true,
    icon: L.divIcon({ className: "", html: `<div class="pin p${r.p}">${r.rank}</div>`, iconSize: [26, 26], iconAnchor: [13, 13], popupAnchor: [0, -12] })
  }).bindPopup(() => popupHtml(r), { maxWidth: 300 });
  r.m.on("popupopen", () => highlight(r, false));
});

let active = null;
function highlight(r, pan) {
  document.querySelectorAll("li.active").forEach(e => e.classList.remove("active"));
  const li = document.getElementById("r" + r.rank);
  if (li) { li.classList.add("active"); if (!pan) li.scrollIntoView({ block: "nearest" }); }
  if (pan) { map.setView([r.lat, r.lng], Math.max(map.getZoom(), 13)); r.m.openPopup(); }
  active = r;
}

const state = { q: "", prices: new Set([1, 2, 3, 4]), sort: "dist", maxd: 999 };
function render() {
  const q = state.q.toLowerCase();
  const rows = R.filter(r => state.prices.has(r.p) && r.d <= state.maxd &&
    (!q || (r.name + " " + r.cuisine + " " + r.hood + " " + r.address).toLowerCase().includes(q)))
    .sort((a, b) => state.sort === "dist" ? a.d - b.d : a.rank - b.rank);
  const show = new Set(rows);
  R.forEach(r => show.has(r) ? r.m.addTo(map) : r.m.remove());
  $("#count").textContent = `${rows.length} of ${R.length} shown`;
  $("#list").innerHTML = rows.map(r => `<li id="r${r.rank}" tabindex="0">
    <div class="rank">#${r.rank}</div>
    <div class="name">${esc(r.name)}<div class="meta">${esc(r.cuisine)} · ${esc(r.hood)}</div></div>
    <div class="dist">${r.d.toFixed(1)} mi<span class="price meta">${esc(r.price)}</span></div></li>`).join("");
}
$("#list").addEventListener("click", e => { const li = e.target.closest("li"); if (li) highlight(R.find(r => "r" + r.rank === li.id), true); });
$("#list").addEventListener("keydown", e => { if (e.key === "Enter") e.target.closest("li")?.click(); });
$("#q").addEventListener("input", e => { state.q = e.target.value; render(); });
$("#sort").addEventListener("change", e => { state.sort = e.target.value; render(); });
$("#maxd").addEventListener("change", e => { state.maxd = +e.target.value; render(); });
document.querySelectorAll(".chip").forEach(b => b.addEventListener("click", () => {
  const p = +b.dataset.p, on = b.getAttribute("aria-pressed") === "true";
  b.setAttribute("aria-pressed", String(!on));
  on ? state.prices.delete(p) : state.prices.add(p);
  render();
}));
render();
// Fit after layout settles; fitting against a not-yet-sized container lands at zoom 0.
const fitAll = () => { map.invalidateSize(); map.fitBounds(L.latLngBounds(R.map(r => [r.lat, r.lng]).concat([HOME])).pad(0.05)); };
fitAll();
if (document.readyState !== "complete") addEventListener("load", fitAll, { once: true });
</script>
</body>
</html>
